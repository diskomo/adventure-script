<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/menu-shell.css" />
    <link rel="stylesheet" href="css/quick-bar.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/mini-menu.css" />
    <link rel="stylesheet" href="css/l3-menu.css" />
    <link rel="stylesheet" href="css/tabs/tour.css" />
    <link rel="stylesheet" href="css/tabs/animations.css" />
    <link rel="stylesheet" href="css/tabs/appearance.css" />
    <link rel="stylesheet" href="css/tabs/chat.css" />
    <link rel="stylesheet" href="css/tabs/passengers.css" />
    <link rel="stylesheet" href="css/tabs/settings.css" />
</head>
<body>
    <div id="mini-menu" class="hidden corner-top-right">
        <div id="mini-open" class="mini-open"></div>
        <div id="mini-stop" class="mini-stop"></div>
        <div id="mini-actions" class="mini-actions"></div>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-status">
            <span id="hud-tour" class="hud-chip"></span>
            <span id="hud-stop" class="hud-chip"></span>
            <span id="hud-vehicle" class="hud-chip"></span>
            <span id="hud-spawn" class="hud-chip"></span>
            <span id="hud-superdrive" class="hud-chip"></span>
        </div>
        <div id="hud-binds" class="hud-binds"></div>
    </div>

    <div id="l3-menu" class="hidden">
        <div class="l3-radial">
            <div id="l3-menu-list" class="l3-radial-options"></div>
            <div id="l3-radial-hub" class="l3-radial-hub"></div>
        </div>
    </div>

    <div id="menu" class="hidden">
        <div class="menu-backdrop"></div>
        <div class="menu-panel">
            <header id="menu-header" class="menu-header">
                <img id="banner" class="banner-img" alt="" />
                <div class="header-overlay">
                    <div class="header-text">
                        <h1 id="header-title" class="header-title">Adventure Tours</h1>
                        <p id="header-subtitle" class="header-subtitle"></p>
                    </div>
                </div>
                <button id="close-btn" class="close-btn" type="button" aria-label="Close menu">&times;</button>
            </header>

            <div class="quick-bar">
                <div class="quick-status" id="quick-status"></div>
                <div class="quick-actions" id="quick-actions"></div>
            </div>

            <div class="menu-body">
                <nav class="sidebar" id="sidebar"></nav>
                <main class="content" id="content"></main>
            </div>
        </div>
    </div>

    <script src="js/dom.js"></script>
    <script src="js/state.js"></script>
    <script src="js/util.js"></script>
    <script src="js/selectors.js"></script>
    <script src="js/render-shared.js"></script>
    <script src="js/render-hud.js"></script>
    <script src="js/render-l3-menu.js"></script>
    <script src="js/render-quick-bar.js"></script>
    <script src="js/render-mini-menu.js"></script>
    <script src="js/tabs/tour.js"></script>
    <script src="js/tabs/animations.js"></script>
    <script src="js/tabs/appearance.js"></script>
    <script src="js/tabs/chat.js"></script>
    <script src="js/tabs/passengers.js"></script>
    <script src="js/tabs/my-tour.js"></script>
    <script src="js/tabs/guide.js"></script>
    <script src="js/tabs/settings.js"></script>
    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
